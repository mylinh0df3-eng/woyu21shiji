<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 / Login - 照片社区</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- ==================== 登录/注册容器 ==================== -->
    <div class="login-container">
        <!-- 标题区域 -->
        <h1>📸 照片社区</h1>
        <p class="login-subtitle">记录美好瞬间 / Capture Beautiful Moments</p>
        
        <!-- 表单区域 -->
        <form id="authForm">
            <!-- 用户名 -->
            <div class="form-group">
                <label>用户名 / Username</label>
                <input type="text" name="username" class="form-input" placeholder="请输入用户名" required>
            </div>
            
            <!-- 密码 -->
            <div class="form-group">
                <label>密码 / Password</label>
                <input type="password" name="password" class="form-input" placeholder="请输入密码" required>
            </div>
            
            <!-- 注册时显示的邮箱（隐藏） -->
            <div class="form-group" id="emailGroup" style="display:none;">
                <label>邮箱（选填）/ Email (optional)</label>
                <input type="email" name="email" class="form-input" placeholder="请输入邮箱">
            </div>
            
            <!-- 隐藏字段：区分登录还是注册 -->
            <input type="hidden" name="action" id="actionInput" value="login">
            
            <!-- 提交按钮 -->
            <button type="submit" class="btn-primary btn-block" id="submitBtn">
                登录 / Login
            </button>
        </form>
        
        <!-- 切换登录/注册 -->
        <p class="form-switch" id="switchText">
            还没有账号？<a href="#" id="switchLink">立即注册 / Register</a>
        </p>
    </div>

    <!-- ==================== 提示消息 ==================== -->
    <div class="toast" id="toast"></div>

    <script>
        // 切换登录/注册模式
        let isLogin = true;
        document.getElementById('switchLink').addEventListener('click', function(e) {
            e.preventDefault();
            isLogin = !isLogin;
            
            if (isLogin) {
                document.getElementById('actionInput').value = 'login';
                document.getElementById('submitBtn').textContent = '登录 / Login';
                document.getElementById('emailGroup').style.display = 'none';
                document.getElementById('switchText').innerHTML = '还没有账号？<a href="#" id="switchLink">立即注册 / Register</a>';
            } else {
                document.getElementById('actionInput').value = 'register';
                document.getElementById('submitBtn').textContent = '注册 / Register';
                document.getElementById('emailGroup').style.display = 'block';
                document.getElementById('switchText').innerHTML = '已有账号？<a href="#" id="switchLink">立即登录 / Login</a>';
            }
        });

        // 提交表单
        document.getElementById('authForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '处理中... / Processing...';
            
            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if (data.success) {
                    showToast('✅ ' + data.message);
                    setTimeout(() => { window.location.href = '/'; }, 1000);
                } else {
                    showToast('❌ ' + data.message);
                }
            } catch (err) {
                showToast('❌ 网络错误 / Network error');
            }
            
            btn.disabled = false;
            btn.textContent = isLogin ? '登录 / Login' : '注册 / Register';
        });

        // 显示提示
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
